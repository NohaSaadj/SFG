<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iventions produced clone</title>
<!-- Söhne and ABC Arizona Mix are licensed; Inter Tight and Newsreader stand in. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;600&family=Newsreader:opsz,wght@6..72,300&display=swap" rel="stylesheet">
<style>
/* Tokens, values from iventions.com CSS */
:root{
  --primary-purple:#8072ff; --purple:#9c93e8; --primary-yellow:#e0ff98; --primary-black:#1e1e1e; --dot:#f2f2f2;
  --easeOutQuart:cubic-bezier(0.165,0.84,0.44,1);
  --font-soehne:"Inter Tight",system-ui,sans-serif; --font-abc-arizona-mix:"Newsreader",Georgia,serif;
}
html{font-size:2.6666666667vw;--gap-x:1.6rem;--padding-x:1.6rem}
@media(min-width:768px){html{font-size:1.3020833333vw;--gap-x:2.4rem;--padding-x:2.4rem}}
@media(min-width:1200px){html{font-size:.5208333333vw;--gap-x:3.2rem;--padding-x:3.2rem}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#efebe8;color:var(--primary-black);font-family:var(--font-soehne);-webkit-font-smoothing:antialiased}
.page_spacer{height:60vh;display:grid;place-items:center;font-size:1.6rem;color:#8a8580}

/* Section: two equal columns, one screen tall, not pinned */
.section_produced{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-x);padding-inline:var(--padding-x);
  position:relative;height:100vh;background:var(--primary-purple);overflow:hidden}
.produced_list-col{grid-row:1/-1;grid-column:1/span 1;position:relative;z-index:4}
.produced_viewport{height:100vh;overflow:hidden}
.produced_track{display:flex;flex-direction:column;will-change:transform}
.produced_group{display:flex;flex-direction:column;color:var(--primary-black);transition:color .8s var(--easeOutQuart)}
.produced_group.is-active{color:var(--primary-yellow)}
.produced_city{font-size:16rem;font-weight:600;line-height:100%;letter-spacing:-.48rem;white-space:nowrap}

.produced_content-col{grid-row:1/-1;grid-column:2/span 1;position:relative;height:100vh;padding-top:3.2rem;
  display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.produced_text{position:relative;z-index:4;align-self:stretch;padding-left:17.2rem;display:flex;flex-direction:column;gap:2.4rem}
.produced_heading{font-size:8rem;font-weight:600;line-height:100%;letter-spacing:-.24rem}
.produced_heading span,.produced_sub span{display:block}
.produced_sub{font-size:2.4rem;font-weight:300;line-height:140%;max-width:59.8rem}

.produced_globe{position:relative;z-index:4;width:calc(min(100vw,100vh)*.8);height:calc(min(100vw,100vh)*.8);
  margin-bottom:min(-22rem,calc((-22/1080)*100vh))}
.produced_globe canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.produced_globe canvas:active{cursor:grabbing}
.produced_markers{position:absolute;inset:0;pointer-events:none}
.marker_anchor{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.marker_fade{transition:all .2s}

/* Markers: ProducedEarth_* rules from the live CSS */
.marker{display:flex;align-items:center;justify-content:center;cursor:pointer;gap:1.2rem;position:relative;pointer-events:auto;
  will-change:opacity;transition:opacity 1.2s var(--easeOutQuart)}
.produced_globe:has(.marker:hover) .marker:not(:hover){opacity:.2}
.marker_core{--size:3.6rem;border-radius:50%;background-color:rgba(229,226,255,.2);-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);
  position:relative;width:var(--size);height:var(--size);margin-left:calc(var(--size)*-.5);will-change:transform;
  transition:transform .8s var(--easeOutQuart),width .8s var(--easeOutQuart),height .8s var(--easeOutQuart)}
.marker_core::before{content:"";position:absolute;top:50%;left:50%;width:1rem;height:1rem;border-radius:50%;background-color:#fff;
  transform:translate(-50%,-50%);will-change:transform;transition:transform .8s var(--easeOutQuart),background-color .8s var(--easeOutQuart)}
.marker:hover .marker_core:not(.is-active){width:4.2rem;height:4.2rem}
.marker.is-active .marker_core{transform:scale(.5)}
.marker.is-active .marker_core::before{transform:translate(-50%,-50%) scale(4);background-color:var(--primary-yellow)}
.marker_label{font-family:var(--font-abc-arizona-mix);font-weight:300;font-size:2.4rem;letter-spacing:-.144rem;line-height:100%;
  color:var(--primary-black);text-decoration:underline;text-underline-offset:5%;text-decoration-thickness:5%;white-space:nowrap;
  cursor:pointer;user-select:none;background:none;border:0;padding:0}
.marker.is-active .marker_label{text-decoration:none}
.marker[data-name="Western Europe"] .marker_label{position:absolute;right:5rem}

/* Below 1200px the original swaps in a stacked mobile layout */
@media(max-width:1199px){
  .section_produced{display:flex;flex-direction:column;height:auto;background:var(--purple);padding:8rem var(--padding-x) 26rem;gap:6rem}
  .produced_list-col{display:none}
  .produced_content-col{height:auto;padding:0;display:contents}
  .produced_text{padding-left:0;gap:2.4rem}
  .produced_heading{font-size:5rem;letter-spacing:-.15rem;line-height:.9}
  .produced_sub{font-size:1.8rem;line-height:1.25}
  .produced_areas{display:flex;flex-direction:column;gap:3.2rem}
  .produced_area summary{list-style:none;cursor:pointer;font-family:var(--font-abc-arizona-mix);font-weight:300;font-size:2.2rem;line-height:1;
    letter-spacing:-.088rem;text-decoration:underline}
  .produced_area summary::-webkit-details-marker{display:none}
  .produced_area p{padding:1.6rem 0 0 3.2rem;font-size:1.4rem;font-weight:300;line-height:1.25}
  .produced_globe{position:absolute;left:50%;bottom:-14rem;transform:translateX(-50%);width:90vw;height:90vw;margin:0}
  .produced_markers{display:none}
}
@media(min-width:1200px){.produced_areas{display:none}}
</style>
</head>
<body>
<div class="page_spacer">Scroll down</div>

<section class="section_produced" id="produced-section" aria-labelledby="produced-heading">
  <div class="produced_list-col">
    <div class="produced_viewport" data-produced-viewport aria-hidden="true">
      <div class="produced_track" data-produced-track></div>
    </div>
  </div>
  <div class="produced_content-col">
    <div class="produced_text">
      <h2 class="produced_heading" id="produced-heading"><span>We’ve produced</span><span>events in Europe’s</span><span>most iconic cities.</span></h2>
      <h3 class="produced_sub"><span>Bringing together audiences, cultures and ideas.</span><span>Boundless reach. Seamless delivery. We bring the spotlight anywhere you need it.</span></h3>
      <div class="produced_areas" data-produced-areas></div>
    </div>
    <div class="produced_globe" data-produced-globe>
      <canvas aria-label="Dotted globe" role="img"></canvas>
      <div class="produced_markers" data-produced-markers></div>
    </div>
  </div>
</section>

<div class="page_spacer">Next section</div>

<script>/*
  Dotted WebGL globe, rebuilt from the iventions.com "produced" section
  (ProducedEarth: three.js points on an icosahedron, detail 64, masked by a
  land texture, OrbitControls with a fixed polar angle and auto-rotate).
  No library: plain WebGL1. Exposes window.DotGlobe(canvas, options).
*/
(function () {
  'use strict';

  // Icosahedron subdivided like THREE.PolyhedronGeometry(detail), projected to the unit sphere.
  function icosphere(detail) {
    var t = (1 + Math.sqrt(5)) / 2;
    var v = [-1, t, 0, 1, t, 0, -1, -t, 0, 1, -t, 0, 0, -1, t, 0, 1, t, 0, -1, -t, 0, 1, -t, t, 0, -1, t, 0, 1, -t, 0, -1, -t, 0, 1];
    var f = [0, 11, 5, 0, 5, 1, 0, 1, 7, 0, 7, 10, 0, 10, 11, 1, 5, 9, 5, 11, 4, 11, 10, 2, 10, 7, 6, 7, 1, 8,
      3, 9, 4, 3, 4, 2, 3, 2, 6, 3, 6, 8, 3, 8, 9, 4, 9, 5, 2, 4, 11, 6, 2, 10, 8, 6, 7, 9, 8, 1];
    var out = [], seen = new Map(), cols = detail + 1;
    function V(i) { return [v[i * 3], v[i * 3 + 1], v[i * 3 + 2]]; }
    function lerp(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
    for (var n = 0; n < f.length; n += 3) {
      var a = V(f[n]), b = V(f[n + 1]), c = V(f[n + 2]);
      for (var i = 0; i <= cols; i++) {
        var aj = lerp(a, c, i / cols), bj = lerp(b, c, i / cols), rows = cols - i;
        for (var j = 0; j <= rows; j++) {
          var p = rows === 0 ? aj : lerp(aj, bj, j / rows);
          var l = Math.hypot(p[0], p[1], p[2]), x = p[0] / l, y = p[1] / l, z = p[2] / l;
          var key = Math.round(x * 1e5) + ',' + Math.round(y * 1e5) + ',' + Math.round(z * 1e5);
          if (seen.has(key)) continue;
          seen.set(key, 1);
          out.push(x, y, z);
        }
      }
    }
    return out;
  }

  // Same mapping as the original's xP(): lat/lng -> position on a sphere.
  function latLng(lat, lng, r) {
    var a = lat * Math.PI / 180, b = lng * Math.PI / 180;
    return [-r * Math.cos(a) * Math.cos(b), r * Math.sin(a), r * Math.cos(a) * Math.sin(b)];
  }

  function perspective(fov, aspect, near, far) {
    var f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
    return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
  }
  function lookAt(e) { // target = origin, up = +Y
    var zx = e[0], zy = e[1], zz = e[2], zl = Math.hypot(zx, zy, zz); zx /= zl; zy /= zl; zz /= zl;
    var xx = zz, xy = 0, xz = -zx, xl = Math.hypot(xx, xz); xx /= xl; xz /= xl; // up x z
    var yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return [xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
      -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1];
  }
  function mul(a, b) { // column-major a*b
    var o = new Array(16);
    for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++)
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    return o;
  }
  function model(rx, ry, s, ty) { // THREE Euler XYZ: Rx * Ry, then scale, then translate
    var cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry);
    return [cy * s, sx * sy * s, -cx * sy * s, 0, 0, cx * s, sx * s, 0, sy * s, -sx * cy * s, cx * cy * s, 0, 0, ty, 0, 1];
  }
  function xform(m, p) {
    return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13],
      m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14], m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15]];
  }

  var VS = 'attribute vec3 position;uniform mat4 mv;uniform mat4 proj;uniform float u_size;uniform float u_dpr;' +
    'varying float vOpacity;void main(){vec4 p=mv*vec4(position,1.);vOpacity=length(p.xyz)-.7;' +
    'gl_PointSize=u_size*(30.*vOpacity/-p.z)*u_dpr;gl_Position=proj*p;}';
  var FS = 'precision mediump float;uniform vec3 u_color;uniform float u_alpha;varying float vOpacity;' +
    'float circle(vec2 st,float r){vec2 d=st-vec2(.5);return 1.-smoothstep(.99*r,1.01*r,dot(d,d)*4.);}' +
    'void main(){float d=circle(gl_PointCoord.xy,.7);if(d<.5)discard;gl_FragColor=vec4(u_color,clamp(d*vOpacity,0.,1.)*u_alpha);}';

  function hex(c) { c = c.replace('#', ''); return [parseInt(c.slice(0, 2), 16) / 255, parseInt(c.slice(2, 4), 16) / 255, parseInt(c.slice(4, 6), 16) / 255]; }

  window.DotGlobe = function (canvas, o) {
    o = Object.assign({
      maskSrc: '', color: '#f2f2f2', alpha: 1, detail: 64, size: 0.125, scale: 2.8, offsetY: 0,
      distance: 9, fov: 40, polar: Math.PI / 2.8, start: { lat: 29.278913, lng: 31.267533 },
      autoRotateSpeed: 0.65, interactive: true, drag: true, parallax: true, markers: [], onFrame: null
    }, o || {});
    var gl = canvas.getContext('webgl', { antialias: true, alpha: true, premultipliedAlpha: false });
    if (!gl) return null;

    function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
    var prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog); gl.useProgram(prog);
    var U = {}; ['mv', 'proj', 'u_size', 'u_dpr', 'u_color', 'u_alpha'].forEach(function (k) { U[k] = gl.getUniformLocation(prog, k); });
    var aPos = gl.getAttribLocation(prog, 'position'), buf = gl.createBuffer(), count = 0;
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.enable(gl.DEPTH_TEST);

    // Keep only the points that land on the mask's dark (land) pixels: mask = 1 - step(0.4, r).
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      var x = c.getContext('2d'); x.drawImage(img, 0, 0);
      var d = x.getImageData(0, 0, c.width, c.height).data, W = c.width, H = c.height;
      var all = icosphere(o.detail), keep = [];
      for (var i = 0; i < all.length; i += 3) {
        var X = all[i], Y = all[i + 1], Z = all[i + 2];
        var u = Math.atan2(Z, -X) / (2 * Math.PI) + 0.5;
        var v = 0.5 - Math.atan2(Y, Math.hypot(X, Z)) / Math.PI;
        var px = Math.min(W - 1, Math.floor(u * W)), py = Math.min(H - 1, Math.floor(v * H));
        if (d[(py * W + px) * 4] < 102) keep.push(X, Y, Z);
      }
      count = keep.length / 3;
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(keep), gl.STATIC_DRAW);
    };
    img.src = o.maskSrc;

    var s0 = latLng(o.start.lat, o.start.lng, 1);
    var state = {
      theta: Math.atan2(s0[0], s0[2]), dTheta: 0, rx: 0, ry: 0,
      autoRotate: true, mouse: [0, 0], dpr: 1, w: 1, h: 1, cam: [0, 0, o.distance]
    };

    function resize() {
      var r = canvas.getBoundingClientRect();
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.w = Math.max(1, r.width); state.h = Math.max(1, r.height);
      canvas.width = Math.round(state.w * state.dpr); canvas.height = Math.round(state.h * state.dpr);
    }

    if (o.interactive && o.drag) { // OrbitControls: horizontal drag only (polar angle is locked), damped
      var drag = null;
      canvas.style.touchAction = 'none';
      canvas.addEventListener('pointerdown', function (e) { drag = e.clientX; canvas.setPointerCapture(e.pointerId); });
      canvas.addEventListener('pointermove', function (e) {
        if (drag === null) return;
        state.dTheta -= 2 * Math.PI * (e.clientX - drag) / state.h; drag = e.clientX;
      });
      ['pointerup', 'pointercancel'].forEach(function (t) { canvas.addEventListener(t, function () { drag = null; }); });
    }
    if (o.parallax) window.addEventListener('pointermove', function (e) { state.mouse = [e.clientX, e.clientY]; }, { passive: true });

    var api = { state: state, resize: resize, running: true, markers: [],
      setColor: function (c) { o.color = c.trim() || o.color; } };

    function frame() {
      if (state.autoRotate && o.interactive) state.dTheta -= 2 * Math.PI / 60 / 60 * o.autoRotateSpeed;
      state.theta += state.dTheta * 0.05; state.dTheta *= 0.95;
      if (o.parallax) {
        state.rx += (2.5e-4 * state.mouse[1] - state.rx) * 0.05;
        state.ry += (-2.5e-4 * state.mouse[0] - state.ry) * 0.05;
      }
      var cam = o.interactive
        ? [o.distance * Math.sin(o.polar) * Math.sin(state.theta), o.distance * Math.cos(o.polar), o.distance * Math.sin(o.polar) * Math.cos(state.theta)]
        : [0, 0, o.distance];
      state.cam = cam;
      var view = lookAt(cam), M = model(state.rx, state.ry, o.scale, o.offsetY), mv = mul(view, M);
      var proj = perspective(o.fov * Math.PI / 180, state.w / state.h, 0.1, 1000);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      if (count) {
        gl.uniformMatrix4fv(U.mv, false, mv); gl.uniformMatrix4fv(U.proj, false, proj);
        gl.uniform1f(U.u_size, o.size); gl.uniform1f(U.u_dpr, state.dpr);
        gl.uniform3fv(U.u_color, hex(o.color)); gl.uniform1f(U.u_alpha, o.alpha);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.POINTS, 0, count);
      }
      // Marker projection, like drei <Html distanceFactor={6}>: screen position, scale, front-facing test.
      var tanH = 2 * Math.tan(o.fov * Math.PI / 360);
      api.markers = o.markers.map(function (m) {
        var local = latLng(m.lat, m.lng, 1.025), w = xform(M, local), e = xform(mv, local), c = xform(proj, e);
        var sx = (c[0] / c[3] * 0.5 + 0.5) * state.w, sy = (-c[1] / c[3] * 0.5 + 0.5) * state.h;
        var dx = w[0] - cam[0], dy = w[1] - cam[1], dz = w[2] - cam[2], dl = Math.hypot(dx, dy, dz);
        var nl = Math.hypot(w[0], w[1], w[2]);
        var facing = (dx * w[0] + dy * w[1] + dz * w[2]) / (dl * nl) < -0.45;
        return { x: sx, y: sy, scale: 6 / (tanH * dl), front: facing };
      });
      if (o.onFrame) o.onFrame(api.markers);
    }
    function loop() { if (api.running) frame(); requestAnimationFrame(loop); }
    api.renderOnce = frame;
    resize(); window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
    return api;
  };
})();
</script>
<script>
(function () {
  // producedLocations, verbatim from the page data
  var AREAS = [
    { area: 'Western Europe', lat: 45.5190165, lng: -1.5558989, cities: ['Toulouse','Glasgow','Copenhagen','Rome','Birmingham','Brussels','Manchester','Edinburgh','Dublin','Luxembourg','Venice','London','Amsterdam','Madrid','Berlin','Vienna','Lisbon','Paris','Barcelona','Munich','Milan','Cardiff','Newcastle','Rotterdam','Vitoria'] },
    { area: 'Eastern Europe', lat: 46.8146553, lng: 21.0171655, cities: ['Riga','Sofia','Bratislava','Ljubljana','Bucharest','Helsinki','Athens','Kaunas','Prague','Budapest','Stockholm','Belgrade','Nicosia','Tallinn','Valletta','Vilnius','Warsaw'] },
    { area: 'Middle East & Asia', lat: 25.2048, lng: 55.2708, cities: ['Abu Dhabi','Istanbul','Shanghai'] }
  ];
  var N = AREAS.length;
  var section = document.querySelector('[data-produced-viewport]').closest('section');
  var viewport = section.querySelector('[data-produced-viewport]');
  var track = section.querySelector('[data-produced-track]');
  var markerLayer = section.querySelector('[data-produced-markers]');

  // The list: Embla, axis y, loop, align centre, three copies of the areas, AutoScroll speed 0.3 px/frame.
  var groups = [];
  for (var s = 0; s < 3; s++) AREAS.forEach(function (a, i) {
    var g = document.createElement('div'); g.className = 'produced_group'; g.dataset.index = i;
    a.cities.forEach(function (c) { var p = document.createElement('p'); p.className = 'produced_city'; p.textContent = c; g.appendChild(p); });
    track.appendChild(g); groups.push(g);
  });

  // Mobile: accordion of areas
  var areasEl = section.querySelector('[data-produced-areas]');
  AREAS.forEach(function (a) {
    var d = document.createElement('details'); d.className = 'produced_area';
    d.innerHTML = '<summary></summary><p></p>';
    d.firstChild.textContent = a.area; d.lastChild.textContent = a.cities.join(', ');
    areasEl.appendChild(d);
  });

  var setH = 0, offset = 0, active = -1, tween = null, resumeAt = 0, lastT = 0;
  function measure() {
    setH = 0; for (var i = 0; i < N; i++) setH += groups[i].offsetHeight;
    // startIndex = originalLength: the first group of the middle copy, centred
    offset = setH + groups[N].offsetHeight / 2 - viewport.clientHeight / 2;
  }
  function wrap(y) { return ((y - setH * 0.5) % setH + setH) % setH + setH * 0.5; }

  function setActive(i) {
    if (i === active) return; active = i;
    groups.forEach(function (g) { g.classList.toggle('is-active', +g.dataset.index === i); });
    markers.forEach(function (m, k) { m.el.classList.toggle('is-active', k === i); m.core.classList.toggle('is-active', k === i); });
  }
  function nearest() { // selectedScrollSnap: the group whose centre is closest to the viewport centre
    var mid = offset + viewport.clientHeight / 2, best = 0, bd = Infinity, y = 0;
    for (var k = 0; k < groups.length; k++) {
      var h = groups[k].offsetHeight, d = Math.abs(y + h / 2 - mid); if (d < bd) { bd = d; best = k; } y += h;
    }
    return { k: best, i: best % N };
  }
