<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iventions produced section clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;600&family=Newsreader:opsz,wght@6..72,300&display=swap" rel="stylesheet">
<style>
/* Stage A reference clone of iventions.com, home page, "produced" section (#produced-section): Iventions' copy and data,
   approximate Iventions colours. Söhne and ABC Arizona Mix are licensed, so Inter Tight and Newsreader stand in.
   Local review only, not for publishing. Measurements and inferred motion: reference/iventions-produced/notes.md */
:root{
  --rem:10px;
  --color-purple:#8073FF;--color-ink:#1E1E1E;--color-yellow:#E0FF98;--color-dot:rgb(255 255 255 / .92);
  --font-soehne:"Inter Tight","Helvetica Neue",Arial,sans-serif;--font-arizona:"Newsreader",Georgia,serif;
  --padding-x:calc(var(--rem) * 1.6);--gap-x:calc(var(--rem) * 1.6);
}
@media (min-width:75rem){:root{--rem:calc(100vw / 192);--padding-x:calc(var(--rem) * 2);--gap-x:calc(var(--rem) * 2)}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-ink);color:var(--color-ink);font-family:var(--font-soehne);-webkit-font-smoothing:antialiased}
.page_spacer{height:60vh;display:grid;place-items:center;color:#F3EFEB;font:300 calc(var(--rem)*2.4)/1.4 var(--font-soehne)}

/* ===== PRODUCED · cloned from iventions.com home ("We've produced events in Europe's most iconic cities") =====
   The section pins for its length. On the left, one column of very large city names moves up as you scroll; on the
   right, the heading and paragraph sit above a dotted globe with one marker per region. The marker of the region whose
   city is at mid-screen turns yellow and the globe turns to face it. */
.section_produced{position:relative;background:var(--color-purple);height:var(--produced-h,300vh);overflow-x:clip}
.produced_sticky{position:sticky;top:0;height:100vh;overflow:hidden}
.produced_contain{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap-x);padding-inline:var(--padding-x);height:100%}
.produced_cities{grid-column:1 / 8;position:relative;overflow:hidden;height:100%}
.produced_list{list-style:none;margin:0;padding:0;will-change:transform}
.produced_city{font:600 calc(var(--rem)*16)/1 var(--font-soehne);letter-spacing:calc(var(--rem)*-.48);white-space:nowrap;padding-bottom:.03em}
.produced_content{grid-column:8 / 13;padding-top:calc(var(--rem)*5);position:relative;z-index:1}
.produced_title{margin:0;font:600 calc(var(--rem)*8)/1 var(--font-soehne);letter-spacing:calc(var(--rem)*-.24);white-space:pre-line}
.produced_text{margin:calc(var(--rem)*2.4) 0 0;max-width:calc(var(--rem)*55);font:300 calc(var(--rem)*2.4)/1.4 var(--font-soehne);white-space:pre-line}
.produced_globe{position:relative;width:calc(var(--rem)*64);aspect-ratio:1;margin:calc(var(--rem)*3.6) 0 0 calc(var(--rem)*-2.5)}
.produced_canvas{position:absolute;inset:0;width:100%;height:100%}
.produced_marker{position:absolute;left:0;top:0;display:flex;align-items:center;gap:calc(var(--rem)*1.2);padding:0;border:0;background:none;
  color:var(--color-ink);cursor:pointer;transform:translate(var(--x),var(--y));transition:opacity .4s}
.produced_marker.is-left{flex-direction:row-reverse}
.produced_marker[hidden]{display:flex;opacity:0;pointer-events:none}
.produced_dot{position:relative;flex:none;width:calc(var(--rem)*4.4);aspect-ratio:1;border-radius:50%;background:rgb(255 255 255 / .28);margin:calc(var(--rem)*-2.2)}
.produced_dot::after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;background:#fff;transition:transform .4s,background-color .4s}
.produced_marker.is-active .produced_dot,.produced_marker:hover .produced_dot,.produced_marker:focus-visible .produced_dot{background:none}
.produced_marker.is-active .produced_dot::after,.produced_marker:hover .produced_dot::after,.produced_marker:focus-visible .produced_dot::after{background:var(--color-yellow);transform:scale(3.2)}
.produced_label{font:300 calc(var(--rem)*2.8)/1 var(--font-arizona);letter-spacing:calc(var(--rem)*-.1);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.12em;white-space:nowrap;margin-inline:calc(var(--rem)*2.4)}
.produced_marker:focus-visible{outline:2px solid var(--color-ink);outline-offset:4px}

/* phones and tablets: stacked, no pin */
@media (max-width:74.99rem){
  .section_produced{height:auto}
  .produced_sticky{position:static;height:auto;overflow:visible;padding-block:calc(var(--rem)*8)}
  .produced_contain{grid-template-columns:repeat(6,1fr);row-gap:calc(var(--rem)*4)}
  .produced_content{grid-column:1 / -1;padding-top:0;grid-row:1}
  .produced_title{font-size:calc(var(--rem)*5);letter-spacing:calc(var(--rem)*-.15);line-height:.9}
  .produced_text{font-size:calc(var(--rem)*1.8);line-height:1.25}
  .produced_globe{width:min(72%,calc(var(--rem)*48));margin:calc(var(--rem)*4) auto 0}
  .produced_label{font-size:calc(var(--rem)*1.6);margin-inline:calc(var(--rem)*1.2)}
  .produced_dot{width:calc(var(--rem)*3);margin:calc(var(--rem)*-1.5)}
  .produced_cities{grid-column:1 / -1;grid-row:2;height:60vh}
  .produced_city{font-size:calc(var(--rem)*5);letter-spacing:calc(var(--rem)*-.15)}
}
@media (prefers-reduced-motion:reduce){.produced_cities{overflow-y:auto}}
</style>
</head>
<body>
<div class="page_spacer">↓ scroll</div>

<section class="section_produced" id="produced-section" aria-labelledby="produced-title" data-produced>
  <div class="produced_sticky">
    <div class="produced_contain">
      <div class="produced_cities" aria-hidden="true"><ul class="produced_list" data-produced-list></ul></div>
      <div class="produced_content">
        <h2 class="produced_title" id="produced-title">We’ve produced
events in Europe’s
most iconic cities.</h2>
        <p class="produced_text">Bringing together audiences, cultures and ideas.
Boundless reach. Seamless delivery. We bring the spotlight anywhere you need it.</p>
        <div class="produced_globe" data-produced-globe>
          <canvas class="produced_canvas" aria-hidden="true"></canvas>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="page_spacer">end of section</div>

      var left=a.side==="left", gx=globe.getBoundingClientRect().left;
      if(!left&&gx+px+m.offsetWidth>document.documentElement.clientWidth-8)left=true;
      if(left&&gx+px-m.offsetWidth<8)left=false;
      m.classList.toggle("is-left",left);
      m.style.setProperty("--x",(left?px-m.offsetWidth:px)+"px"); m.style.setProperty("--y",(py-m.offsetHeight/2)+"px");
    });
  }

  var range=0, pinned=true;
  function measure(){
    pinned=matchMedia("(min-width:75rem)").matches;
    var listH=list.scrollHeight, winH=win.clientHeight;
    range=Math.max(0,listH-winH);
    root.style.setProperty("--produced-h",pinned?(innerHeight+range*1.0)+"px":"auto");
    resize(); onScroll();
  }
  function progress(){
    var r=root.getBoundingClientRect();
    if(pinned){var len=root.offsetHeight-innerHeight; return len>0?Math.min(1,Math.max(0,-r.top/len)):0;}
    var w=win.getBoundingClientRect(); return Math.min(1,Math.max(0,(innerHeight-w.top)/(innerHeight+w.height)));
  }
  function onScroll(){
    if(reduce){setActive(0);return;}
    var y=-progress()*range; list.style.transform="translate3d(0,"+y+"px,0)";
    var mid=win.getBoundingClientRect().top+win.clientHeight/2, best=0, bd=1e9;
    for(var i=0;i<items.length;i++){var b=items[i].offsetTop+y+items[i].offsetHeight/2+win.getBoundingClientRect().top-mid; if(Math.abs(b)<bd){bd=Math.abs(b);best=i;}}
    setActive(+items[best].dataset.area);
  }
  function setActive(ai){ if(ai===active)return; active=ai; markers.forEach(function(m,i){m.classList.toggle("is-active",i===ai);}); target.lat=AREAS[ai].view[0]; target.lon=AREAS[ai].view[1]; }
  function goTo(ai){
    var first=items.findIndex(function(li){return +li.dataset.area===ai;});
    if(!pinned||reduce){win.scrollTop=items[first].offsetTop; setActive(ai); return;}
    var len=root.offsetHeight-innerHeight, p=Math.min(1,(items[first].offsetTop+items[first].offsetHeight/2-win.clientHeight/2)/range);
    scrollTo({top:root.getBoundingClientRect().top+scrollY+Math.max(0,p)*len,behavior:"smooth"});
  }
  var t0=performance.now();
  function tick(t){
    var drift=reduce?0:Math.sin((t-t0)/6000)*3;
    view.lat+=(target.lat-view.lat)*.06; view.lon+=(target.lon+drift-view.lon)*.06;
    draw(); requestAnimationFrame(tick);
  }
  addEventListener("scroll",onScroll,{passive:true}); addEventListener("resize",measure);
  (document.fonts?document.fonts.ready:Promise.resolve()).then(function(){measure(); requestAnimationFrame(tick);});
})();
</script>
</body>
</html>
